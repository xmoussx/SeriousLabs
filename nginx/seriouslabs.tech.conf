# seriouslabs.tech — site vitrine Serious Labs
# Statique, avec un unique point d'entrée PHP pour le formulaire de contact.

# HTTP : tout part en HTTPS, sauf le renouvellement du certificat.
server {
    listen 80;
    listen [::]:80;
    server_name seriouslabs.tech www.seriouslabs.tech nouveau.seriouslabs.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/seriouslabs;
    }

    location / {
        return 301 https://seriouslabs.tech$request_uri;
    }
}

# HTTPS sur www et sur le nom de préproduction : on renvoie vers le domaine
# canonique, pour ne pas servir le même contenu sous trois adresses.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.seriouslabs.tech nouveau.seriouslabs.tech;

    ssl_certificate     /etc/letsencrypt/live/seriouslabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seriouslabs.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://seriouslabs.tech$request_uri;
}

# Le site lui-même.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seriouslabs.tech;

    ssl_certificate     /etc/letsencrypt/live/seriouslabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seriouslabs.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/seriouslabs;
    index index.html;
    charset utf-8;

    # ATTENTION : un seul add_header dans un bloc location suffit à annuler
    # TOUS ceux hérités d'ici. C'est pourquoi la mise en cache est réglée plus
    # bas avec la directive expires, qui n'a pas cet effet de bord, et non
    # avec add_header Cache-Control.
    #
    # HSTS sans includeSubDomains : les sous-domaines servent des projets en
    # cours et un nouveau sous-domaine en HTTP simple deviendrait injoignable.
    # Sans preload non plus : l'inscription aux listes des navigateurs met des
    # mois à se défaire.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    client_max_body_size 1m;

    # Le seul PHP du site.
    location = /api/contact.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Rien d'autre ne doit être interprété.
    location ~ \.php$ { return 404; }

    # Fichiers sensibles ou internes.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(var|api/lib)/ { deny all; }

    # expires 30d -> Cache-Control: max-age=2592000, sans casser l'héritage.
    location ^~ /assets/ {
        expires 30d;
    }

    # nginx 1.18 ne connaît pas woff2 dans ses types par défaut : sans ça les
    # polices partent en application/octet-stream.
    location ^~ /assets/fonts/ {
        types { font/woff2 woff2; font/woff woff; }
        default_type font/woff2;
        # Pas d'add_header ici : un seul suffirait à annuler tous les en-têtes
        # de sécurité hérités du bloc serveur. expires n'a pas cet effet.
        expires 365d;
    }

    # expires -1 -> Cache-Control: no-cache, sans casser l'héritage.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /index.html;
}
